# Runtime configuration for the product-ad data pipeline and reserved ranking stages.
project:
  name: search-ads-algorithm-system
  seed: 2026

# All generated data products are kept below outputs/. Raw input is read in place.
paths:
  outputs_dir: outputs
  schema_report: outputs/preprocessing/schema_report.json
  unified_data: outputs/processed/criteo_unified
  eda_summary: outputs/eda/summary.json
  eda_categories: outputs/eda/top_categories.csv
  feature_data: outputs/features/criteo_features
  feature_metadata: outputs/features/metadata.json

preprocessing:
  # This contract is transcribed from the dataset's bundled README. The source
  # file itself has no header, so the ordered names must be supplied explicitly.
  dataset:
    path: data/raw/Criteo_Conversion_Search/CriteoSearchData
    delimiter: "\t"
    has_header: false
    encoding: utf-8
    chunk_size: 200000
    column_names:
      - Sale
      - SalesAmountInEuro
      - time_delay_for_conversion
      - click_timestamp
      - nb_clicks_1week
      - product_price
      - product_age_group
      - device_type
      - audience_id
      - product_gender
      - product_brand
      - product_category_1
      - product_category_2
      - product_category_3
      - product_category_4
      - product_category_5
      - product_category_6
      - product_category_7
      - product_country
      - product_id
      - product_title
      - partner_id
      - user_id
    # Label selection is configuration, not inferred by preprocessing code.
    label_columns: [Sale]
    missing_value_tokens:
      default: ["", "-1"]
      by_column:
        click_timestamp: ["0"]
  eda:
    categorical_columns: [device_type, product_age_group, product_gender, product_country]
    top_k: 20
  features:
    categorical_columns:
      - device_type
      - product_age_group
      - product_gender
      - product_brand
      - product_country
      - product_category_1
      - product_category_2
      - product_category_3
      - product_category_4
      - audience_id
      - product_id
      - partner_id
      - user_id
    missing_category_token: __MISSING__

training:
  batch_size: 512
  learning_rate: 0.001
  epochs: 10
  num_workers: 4
  device: auto

recall:
  model: itemcf
  top_k: 200
  itemcf:
    # A file or a directory containing headered CSV interaction records.
    # The default uses the project's unified Criteo click/conversion output.
    input_path: outputs/processed/criteo_unified
    output_path: outputs/recall_candidates/itemcf_topk.csv
    user_id_column: user_id
    item_id_column: product_id
    interaction_label_column: conversion_label
    # Every input row is a click interaction in the unified Criteo data. A
    # conversion receives more weight while non-converting clicks remain valid
    # implicit-feedback interactions.
    interaction_label_weights:
      "0": 1.0
      "1": 3.0
    default_interaction_weight: 1.0
    interaction_aggregation: sum
    similarity: cosine
    input_chunk_size: 200000
    # Sampling is deliberately applied after the full item-similarity matrix
    # has been built, so it changes only the users emitted in the candidates.
    user_sampling:
      enabled: true
      max_users: 1000000
    candidate_generation:
      user_batch_size: 10000

prerank:
  model: placeholder
  top_k: 100

ranking:
  model: deepfm
  hidden_dims: [256, 128]
  dropout: 0.1

value_ranking:
  model: esmm
  tasks: [ctr, cvr]

auction:
  mechanism: second_price
  reserve_price: 0.0

evaluation:
  metrics: [auc, logloss, ndcg]
