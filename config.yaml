# Runtime configuration for the product-ad data pipeline and reserved ranking stages.
project:
  name: search-ads-algorithm-system
  seed: 2026

# All generated data products are kept below outputs/. Raw input is read in place.
paths:
  outputs_dir: outputs
  schema_report: outputs/preprocessing/schema_report.json
  unified_data: outputs/processed/criteo_unified
  eda_summary: outputs/eda/summary.json
  eda_categories: outputs/eda/top_categories.csv
  feature_data: outputs/features/criteo_features
  feature_metadata: outputs/features/metadata.json

preprocessing:
  # This contract is transcribed from the dataset's bundled README. The source
  # file itself has no header, so the ordered names must be supplied explicitly.
  dataset:
    path: data/raw/Criteo_Conversion_Search/CriteoSearchData
    delimiter: "\t"
    has_header: false
    encoding: utf-8
    chunk_size: 200000
    column_names:
      - Sale
      - SalesAmountInEuro
      - time_delay_for_conversion
      - click_timestamp
      - nb_clicks_1week
      - product_price
      - product_age_group
      - device_type
      - audience_id
      - product_gender
      - product_brand
      - product_category_1
      - product_category_2
      - product_category_3
      - product_category_4
      - product_category_5
      - product_category_6
      - product_category_7
      - product_country
      - product_id
      - product_title
      - partner_id
      - user_id
    # Label selection is configuration, not inferred by preprocessing code.
    label_columns: [Sale]
    missing_value_tokens:
      default: ["", "-1"]
      by_column:
        click_timestamp: ["0"]
  eda:
    categorical_columns: [device_type, product_age_group, product_gender, product_country]
    top_k: 20
  features:
    categorical_columns:
      - device_type
      - product_age_group
      - product_gender
      - product_brand
      - product_country
      - product_category_1
      - product_category_2
      - product_category_3
      - product_category_4
      - audience_id
      - product_id
      - partner_id
      - user_id
    missing_category_token: __MISSING__

# Independent display-impression contract. This intentionally has no linkage to
# the clicked-only Search Conversion pipeline or its temporal/recall artifacts.
attribution_preprocessing:
  dataset:
    path: criteo_attribution/criteo_attribution_dataset.tsv
    delimiter: "\t"
    has_header: true
    encoding: utf-8
    chunk_size: 200000
    column_names:
      - timestamp
      - uid
      - campaign
      - conversion
      - conversion_timestamp
      - conversion_id
      - attribution
      - click
      - click_pos
      - click_nb
      - cost
      - cpo
      - time_since_last_click
      - cat1
      - cat2
      - cat3
      - cat4
      - cat5
      - cat6
      - cat7
      - cat8
      - cat9
    label_columns: [click, conversion]
    missing_value_tokens:
      default: ["", "-1"]
  processed_data: outputs/processed/criteo_attribution_impression
  temporal_output_dir: outputs/attribution_temporal
  build_metadata_path: outputs/metrics/attribution_impression_build_metadata.json
  audit_path: outputs/metrics/attribution_impression_data_audit.json
  split:
    # Future-A/Future-B are equal timestamp-contiguous subwindows of Future.
    past_ratio: 0.8
    future_a_ratio: 0.5

# Attribution-only standard ESMM experiment. It reads Past for fitting/training
# and Future-A for development evaluation; no option or path exposes Future-B.
attribution_esmm:
  enabled: true
  seed: 2026
  device: auto
  embedding_dim: 16
  hash_buckets:
    user_id: 1048576
    campaign_id: 262144
    categories: 262144
  shared_hidden_dims: [256, 128]
  ctr_hidden_dims: [128, 64]
  cvr_hidden_dims: [128, 64]
  batch_size: 8192
  inference_batch_size: 32768
  io_chunk_size: 200000
  epochs: 3
  learning_rate: 0.001
  weight_decay: 0.00001
  lambda_ctcvr: 1.0
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  mixed_precision: true
  # null means the whole respective split. Limits select deterministic leading
  # rows in the split and are for bounded development, not random tuning.
  max_train_rows: null
  max_validation_rows: null
  early_stopping_patience: 1
  checkpoint_dir: outputs/attribution/models
  metrics_dir: outputs/attribution/metrics
  sanity:
    max_train_rows: 200000
    max_validation_rows: 100000
    epochs: 1

# Probability calibration for the fixed formal Attribution ESMM checkpoint.
# It creates an earlier/later strict-time split inside Future-A only.
attribution_calibration:
  checkpoint_path: outputs/attribution/models/esmm.pt
  output_dir: outputs/attribution/calibration
  metrics_dir: outputs/attribution/metrics
  fit_ratio: 0.5
  epsilon: 0.0000001
  reliability_bins: 20
  inference_batch_size: 32768
  io_chunk_size: 200000
  mixed_precision: true
  sanity:
    max_rows: 100000

training:
  batch_size: 512
  learning_rate: 0.001
  epochs: 10
  num_workers: 4
  device: auto

recall:
  model: itemcf
  # Formal advertising funnel: each route supplies a Top1000 inventory, then
  # the fixed development-selected weighted RRF produces Recall Top1000.
  top_k: 1000
  popularity:
    input_path: outputs/processed/criteo_unified
    output_path: outputs/recall_candidates/popularity_topk.csv
    top_k: 1000
    click_weight: 1.0
    conversion_weight: 3.0
    chunk_size: 200000
  two_tower:
    input_path: outputs/processed/criteo_unified
    output_path: outputs/recall_candidates/two_tower_topk.csv
    index_path: outputs/recall_candidates/faiss_ad_index
    checkpoint_path: outputs/recall_candidates/two_tower_checkpoint.pt
    embedding_dim: 64
    batch_size: 4096
    epochs: 3
    learning_rate: 0.001
    top_k: 1000
    max_users: 500000
    negative_samples: 5
    interaction_weights:
      click: 1.0
      conversion: 3.0
    # auto selects CUDA when PyTorch detects it, otherwise CPU.
    device: auto
    # false: infer from an existing checkpoint; true: force a retraining run.
    # If no checkpoint exists, a first training run is performed automatically.
    train: false
    # Bounded-memory FAISS inference and CSV writing batch size.
    search_batch_size: 10000
    faiss:
      index_type: hnsw
      hnsw_m: 32
      ef_construction: 200
      ef_search: 64
  itemcf:
    # A file or a directory containing headered CSV interaction records.
    # The default uses the project's unified Criteo click/conversion output.
    input_path: outputs/processed/criteo_unified
    output_path: outputs/recall_candidates/itemcf_topk.csv
    user_id_column: user_id
    item_id_column: product_id
    interaction_label_column: conversion_label
    top_k: 1000
    # Every input row is a click interaction in the unified Criteo data. A
    # conversion receives more weight while non-converting clicks remain valid
    # implicit-feedback interactions.
    interaction_label_weights:
      "0": 1.0
      "1": 3.0
    default_interaction_weight: 1.0
    interaction_aggregation: sum
    similarity: cosine
    input_chunk_size: 200000
    # Sampling is deliberately applied after the full item-similarity matrix
    # has been built, so it changes only the users emitted in the candidates.
    user_sampling:
      enabled: true
      max_users: 1000000
    candidate_generation:
      user_batch_size: 10000
  rrf:
    k: 100
    output_path: outputs/recall_candidates/fused_top1000.csv
    weights:
      itemcf: 2.0
      two_tower: 1.0
      popularity: 2.0
    top_k_per_user: 1000
    max_users: 500000

prerank:
  model: placeholder
  top_k: 100

coarse_rank:
  # Preserve and reuse the existing sklearn HistGBDT checkpoint by default.
  model_type: hist_gbdt
  input_path: outputs/recall_candidates/fused_top1000.csv
  interaction_path: outputs/processed/criteo_unified
  output_path: outputs/ranking/coarse_rank_topk.csv
  model_path: outputs/models/coarse_rank_model.pkl
  train: true
  max_train_rows: 2000000
  max_users: 500000
  top_k: 100
  chunk_size: 200000
  random_seed: 2026
  negative_sampling:
    negatives_per_positive: 5
  conversion_sample_weight: 3.0
  # Bounded product-feature lookup cache for streaming inference.
  feature_cache_size: 100000
  # Tune on the deployment host; each process limits native math threads to 1.
  num_workers: 12
  inference_batch_users: 1000
  inference_batch_candidates: 100000
  prefetch_batches: 2
  # HistGBDT is CPU-only. A requested experimental GPU backend falls back with a log.
  enable_gpu_if_available: false

# Click-conditioned CVR/value fine rank. It intentionally does not train a
# pseudo-CTR model: only observed click interactions become training rows.
fine_rank:
  enabled: true
  mode: full
  input_path: outputs/ranking/coarse_rank_topk.csv
  output_path: outputs/ranking/fine_rank_topk.csv
  model_path: outputs/models/fine_rank_dcnv2.pt
  cache_dir: outputs/ranking/fine_rank/train
  model: dcnv2
  top_k: 20
  max_train_rows: 3000000
  embedding_dim: 32
  hidden_dims: [256, 128, 64]
  num_cross_layers: 3
  batch_size: 8192
  inference_batch_size: 32768
  # Candidate CSV is read in chunk_size-sized vectorized frames.  The feature
  # SQLite index is preloaded once when its on-disk size is within this limit.
  feature_index_memory_limit_gb: 8.0
  inference_progress_rows: 1000000
  epochs: 1
  learning_rate: 0.0005
  weight_decay: 0.00001
  value_loss_weight: 0.2
  gradient_clip_norm: 5.0
  # Raw conversion values are trained as train-split-normalized log1p targets;
  # this upper bound is applied before expm1 during decode to prevent overflow.
  value_log_clip_max: 20.0
  device: auto
  num_workers: 12
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true
  amp: true
  # Read-only checkpoint/cache audit.  This does not retrain or modify the
  # production DCNv2 checkpoint.  The optional A/B/C/D ID ablation is enabled
  # only with `run_fine_rank.py --stage audit --with-id-ablation`.
  audit:
    output_path: outputs/metrics/fine_rank_audit.json
    calibration_bins: 20
    output_chunk_size: 500000
    ablation_train_rows: 100000
    ablation_validation_rows: 50000
    ablation_epochs: 1
    ablation_batch_size: 8192
  early_stopping:
    enabled: true
    patience: 2
  train: true

# Independent Search Conversion clicked-interaction multi-task fine rank.
# Past trains and Future-A selects; Future-B is intentionally never opened by
# this pipeline for model selection.
fine_rank_multitask:
  batch_size: 8192
  epochs: 3
  learning_rate: 0.0005
  weight_decay: 0.00001
  amp: true
  patience: 2
  lambda_cvr: 1.0
  lambda_value: 0.2
  embedding_dim: 32
  hidden_dims: [256, 128, 64]
  cross_layers: 3
  chunk_size: 200000
  num_workers: 4
  device: auto
  model_dir: outputs/fine_rank/models
  metrics_dir: outputs/fine_rank/metrics
  sanity:
    max_train_rows: 200000
    max_validation_rows: 100000
    epochs: 1
    batch_size: 4096
    embedding_dim: 16
    hidden_dims: [64, 32]
    num_workers: 0
  # Independent credibility audit. It opens only Past and Future-A; Future-B
  # is path-checked but never read.
  audit:
    output_dir: outputs/fine_rank/audit
    epochs: 3
    batch_size: 8192
    patience: 2
    max_train_rows: null
    max_validation_rows: null
    max_diagnostic_rows: 1000000
    sanity:
      max_train_rows: 200000
      max_validation_rows: 100000
      max_diagnostic_rows: 100000
      epochs: 1
      batch_size: 4096
  predictions:
    checkpoint: outputs/fine_rank/models/dcnv2.pt
    output_dir: outputs/fine_rank/predictions/future_a_predictions
    max_rows: null
    sanity:
      max_rows: 100000

ranking:
  model: deepfm
  hidden_dims: [256, 128]
  dropout: 0.1

value_ranking:
  model: esmm
  tasks: [ctr, cvr]

auction:
  mechanism: second_price
  reserve_price: 0.0

# All fields below govern an explicitly synthetic offline simulation. The
# pipeline reads Attribution Future-A calibration artifacts only and never
# joins them to Search Conversion records.
business_simulation:
  output_dir: outputs/business_simulation
  seed: 2026
  candidates_per_auction: 5
  mechanism: second_price
  base_bid: 1.0
  total_budget: 1000.0
  pacing_min: 0.5
  pacing_max: 2.0
  budget_levels: [0.25, 0.50, 0.75, 1.0]
  target_cpa:
    enabled: true
    target_cpa_values: [0.5, 1.0, 2.0]
    default_target_cpa: 1.0
    bid_scale: 1.0
  value_based_bidding:
    enabled: true
    target_roas_values: [1.0, 2.0, 4.0]
    default_target_roas: 2.0
    bid_scale: 1.0
    # Null means unavailable.  Do not point this to labels, actual conversion
    # value, or a Search Conversion field: no legal cross-dataset mapping exists.
    prediction_column: null
  pacing:
    enabled: true
    alpha: 0.2
    epsilon: 1.0e-12
    comparison_policies: [calibrated_ctcvr_scaled, target_cpa_bidding]
    trajectory_buckets: 10
  max_rows: null
  # Optional standalone clicked-interaction predictions. Expected columns:
  # pCVR_clicked, predicted_conditional_value, conversion_value_eur.
  # This input is never joined with Attribution rows.
  search_prediction_path: outputs/fine_rank/predictions/future_a_predictions
  search_selection_fractions: [0.10, 0.25, 0.50, 0.75, 1.0]
  sanity:
    max_rows: 100000

evaluation:
  metrics: [auc, logloss, ndcg]

# One-way final holdout settings. These thresholds are frozen before Future-B
# is opened and are used only to describe observed degradation.
final_evaluation:
  output_dir: outputs/final_evaluation
  moderate_degradation_threshold: 0.05
  large_degradation_threshold: 0.15

# Isolated strict-time offline experiment.  Artifacts stay below outputs/temporal
# and must never reuse full-data recall checkpoints or fused candidates.
temporal:
  enabled: true
  output_dir: outputs/temporal
  chunk_size: 200000
  split:
    timestamp_column: click_timestamp
    past_ratio: 0.8
  users:
    max_users: 100000
    seed: 2026
  # Temporal Fine Rank keeps all artifacts under outputs/temporal.  Set
  # fine_rank.mode: temporal for a formal run.  The CLI temporal_sanity stage
  # overlays this bounded block and intentionally skips inference.
  fine_rank:
    sanity:
      # Temporal data has far fewer observed interactions and substantial
      # user/product cold start, so do not allocate the full-mode 1M x 32
      # raw-ID embedding capacity in this fresh sanity checkpoint.
      embedding_dim: 16
      hidden_dims: [64, 32]
      hash_buckets:
        user_id: 65537
        product_id: 65537
      max_train_rows: 200000
      epochs: 1
      batch_size: 4096
      inference_batch_size: 16384
      num_workers: 4
      persistent_workers: true
      train: true
    audit:
      output_path: outputs/temporal/metrics/fine_rank_audit.json
      calibration_bins: 20
      output_chunk_size: 500000
      ablation_train_rows: 100000
      ablation_validation_rows: 50000
      ablation_epochs: 1
      ablation_batch_size: 8192
      # Compact temporal diagnostic models: deliberately avoid 1M-bucket,
      # 32-dim raw-ID capacity for a ~64k-row sanity experiment.
      temporal_embedding_dim: 16
      temporal_id_bucket_size: 65537
      temporal_hidden_dims: [64, 32]
      temporal_experiment_train_rows: 100000
      temporal_experiment_validation_rows: 100000
      temporal_experiment_epochs: [1, 3, 5]
      temporal_prior_smoothing: 20.0
  recall:
    # Formal strict-temporal funnel parameters. fusion_sweep remains a frozen
    # experiment record and is not run by the funnel stages.
    itemcf_top_k: 1000
    two_tower_top_k: 1000
    popularity_top_k: 1000
    rrf_top_k: 1000
    # Independent, Future-A-only fusion development. This does not overwrite
    # fused_candidates.csv or formal production RRF parameters.
    fusion_sweep:
      top_k: 100
      popularity_min_quota: 25
      balanced_min_quota: 20
    # Strict temporal content Two-Tower. A non-null catalogue must be a
    # point-in-time product snapshot available by the end of Past; do not set
    # this to split/future_a or split/future_b. Null is safest but cannot index
    # products that were absent from Past interactions.
    content_two_tower:
      product_catalog_path: null
      # Required when product_catalog_path is set: declared snapshot time at
      # or before the Past boundary, never a Future-A/B-derived table.
      product_catalog_as_of_timestamp: null
      embedding_dim: 16
      hidden_dim: 64
      categorical_buckets: 4096
      product_id_buckets: 65537
      batch_size: 4096
      epochs: 3
      learning_rate: 0.001
      negative_samples: 5
      max_history_items: 100
      sanity:
        max_train_rows: 10000
        epochs: 1
  coarse_rank:
    max_train_rows: 1000000
    top_k: 100
